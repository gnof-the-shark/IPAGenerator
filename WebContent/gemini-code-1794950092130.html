<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Test Convertisseur iPhone</title>
  <style>
    :root {
      --primary: #ff2a85;
      --secondary: #00f2fe;
      --accent: #4facfe;
      --bg-dark: #090a0f;
      --glass: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
      color: #ffffff;
      min-height: 100vh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 20px) env(safe-area-inset-right, 20px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 20px);
      position: relative;
    }

    #particle-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      z-index: 1;
      opacity: 0.6;
      animation: floatOrb 8s infinite alternate ease-in-out;
    }

    .orb-1 {
      width: 220px;
      height: 220px;
      background: var(--primary);
      top: 10%;
      left: -10%;
    }

    .orb-2 {
      width: 260px;
      height: 260px;
      background: var(--secondary);
      bottom: 15%;
      right: -15%;
      animation-delay: -4s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.2); }
    }

    .header-bar {
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
    }

    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 12px #00ff88;
      margin-right: 6px;
      animation: pulseDot 1.5s infinite;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.5; }
    }

    .main-card {
      position: relative;
      z-index: 10;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 32px;
      padding: 40px 25px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.3);
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
    }

    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      background: linear-gradient(90deg, rgba(255, 42, 133, 0.3), rgba(0, 242, 254, 0.3));
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 36px;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 18px;
      background: linear-gradient(135deg, #ffffff 0%, #00f2fe 50%, #ff2a85 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shineText 3s linear infinite;
      text-shadow: 0 10px 30px rgba(0, 242, 254, 0.2);
    }

    @keyframes shineText {
      to { background-position: 200% center; }
    }

    p.subtitle {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 30px;
    }

    .metric-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 12px 6px;
    }

    .metric-val {
      font-size: 16px;
      font-weight: 700;
      color: var(--secondary);
      font-variant-numeric: tabular-nums;
    }

    .metric-label {
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      margin-top: 4px;
      text-transform: uppercase;
    }

    .btn-magic {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 20px;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(45deg, var(--primary), var(--accent), var(--secondary));
      background-size: 200% 200%;
      animation: gradientShift 4s ease infinite;
      box-shadow: 0 10px 25px rgba(255, 42, 133, 0.5);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-magic:active {
      transform: scale(0.94);
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .footer-console {
      position: relative;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 12px 15px;
      font-family: "SF Mono", Menlo, Monaco, Courier, monospace;
      font-size: 11px;
      color: #00ff88;
      height: 68px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.6);
      transform: scale(0);
      animation: rippleAnim 0.6s linear;
      pointer-events: none;
    }

    @keyframes rippleAnim {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="header-bar">
    <div><span class="status-dot"></span>Moteur JS Actif</div>
    <div id="clock">00:00:00</div>
  </div>

  <div class="main-card" id="tilt-card">
    <div class="badge">iOS Viewport &amp; WebGL/2D</div>
    <h1 id="main-title">Ceci est un test</h1>
    <p class="subtitle">
      Si les dégradés, le flou d'arrière-plan, les particules et les animations répondent au toucher, la conversion est réussie.
    </p>

    <div class="metrics-grid">
      <div class="metric-box">
        <div class="metric-val" id="fps-counter">60</div>
        <div class="metric-label">FPS</div>
      </div>
      <div class="metric-box">
        <div class="metric-val" id="click-counter">0</div>
        <div class="metric-label">Touches</div>
      </div>
      <div class="metric-box">
        <div class="metric-val" id="screen-res">--</div>
        <div class="metric-label">Écran</div>
      </div>
    </div>

    <button class="btn-magic" id="action-btn">Tester l'interaction</button>
  </div>

  <div class="footer-console" id="console-log">
    <div>&gt; Initialisation du DOM terminée...</div>
  </div>

  <script>
    // 1. Système de particules inutiles sur Canvas
    const canvas = document.getElementById('particle-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      document.getElementById('screen-res').textContent = `${window.innerWidth}x${window.innerHeight}`;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor(x, y, burst = false) {
        this.x = x || Math.random() * canvas.width;
        this.y = y || Math.random() * canvas.height;
        this.size = burst ? Math.random() * 5 + 2 : Math.random() * 2.5 + 0.5;
        this.speedX = (Math.random() - 0.5) * (burst ? 8 : 1.2);
        this.speedY = (Math.random() - 0.5) * (burst ? 8 : 1.2);
        this.color = Math.random() > 0.5 ? '#00f2fe' : '#ff2a85';
        this.alpha = 1;
        this.burst = burst;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.burst) {
          this.alpha -= 0.02;
        } else {
          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
        }
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 55; i++) {
      particles.push(new Particle());
    }

    // 2. Compteur FPS et boucle d'animation
    let lastTime = performance.now();
    let frames = 0;
    const fpsEl = document.getElementById('fps-counter');

    function animate(now) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].burst && particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      // Dessiner des lignes entre particules proches
      for (let i = 0; i < particles.length; i++) {
        for (let j = i + 1; j < particles.length; j++) {
          if (particles[i].burst || particles[j].burst) continue;
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.hypot(dx, dy);
          if (dist < 90) {
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.15 - dist / 600})`;
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }

      frames++;
      if (now - lastTime >= 1000) {
        fpsEl.textContent = frames;
        frames = 0;
        lastTime = now;
      }
      requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    // 3. Horloge temps réel
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('fr-FR');
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 4. Console de logs inutiles
    const consoleBox = document.getElementById('console-log');
    function logMessage(msg) {
      const line = document.createElement('div');
      line.textContent = `> ${msg}`;
      consoleBox.appendChild(line);
      if (consoleBox.children.length > 3) {
        consoleBox.removeChild(consoleBox.firstChild);
      }
    }

    // 5. Interactions tactiles, explosion de particules et effet 3D
    let clicks = 0;
    const btn = document.getElementById('action-btn');
    const title = document.getElementById('main-title');
    const card = document.getElementById('tilt-card');
    const phrases = [
      "Ceci est un test",
      "JS 100% fonctionnel !",
      "CSS Glassmorphism OK",
      "Animations fluides",
      "Convertisseur validé"
    ];

    btn.addEventListener('click', (e) => {
      clicks++;
      document.getElementById('click-counter').textContent = clicks;

      // Effet d'onde sur le bouton
      const rect = btn.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = `${size}px`;
      ripple.style.left = `${e.clientX - rect.left - size / 2}px`;
      ripple.style.top = `${e.clientY - rect.top - size / 2}px`;
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);

      // Explosion de particules
      for (let i = 0; i < 25; i++) {
        particles.push(new Particle(e.clientX, e.clientY, true));
      }

      // Changement de texte et couleur aléatoire
      title.textContent = phrases[clicks % phrases.length];
      const randomHue = Math.floor(Math.random() * 360);
      document.documentElement.style.setProperty('--primary', `hsl(${randomHue}, 90%, 55%)`);

      logMessage(`Interaction #${clicks} détectée (Hue: ${randomHue}°)`);
    });

    // Effet d'inclinaison au glissement du doigt sur l'écran
    document.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const xAxis = (window.innerWidth / 2 - touch.clientX) / 20;
      const yAxis = (window.innerHeight / 2 - touch.clientY) / 20;
      card.style.transform = `perspective(1000px) rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    }, { passive: true });

    document.addEventListener('touchend', () => {
      card.style.transform = `perspective(1000px) rotateY(0deg) rotateX(0deg)`;
    });
  </script>
</body>
</html>
